name: Cloud memory

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: synapse
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synapse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_SSL: disable
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/synapse
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Test with Postgres
        run: npm test -- --test-concurrency=1
      - name: Validate plugin
        run: npm run validate:plugin
      - name: Build production image
        run: docker build --tag synapse-memory:test .
